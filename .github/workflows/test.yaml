name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          enable-cache: true
          # version: "0.10.7"

      - name: Check uv version
        run: uv --version

      - name: Set up Python
        run: uv python install

      - name: Run tests
        run: uv run --no-sync pytest
